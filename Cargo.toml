[package]
name = "independent-download-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
build = "build.rs"

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = "1.8"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
slint-build = "1.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
